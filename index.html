ews-events/press-releases/detail/1759/intel-reports-fourth-quarter-and-full-year-2025-financial"}], "calculation": null}}, {"id": "1-2", "number": "1.2", "chapter": "mindset", "title": "溝落之前，先問理由", "desc": "分清加碼投資同唔肯認輸。", "takeaway": ["跌得多唔等於安全。", "溝落會增加同一個風險嘅曝險。", "先定方法，唔好見跌先臨時改策略。"], "author": "2008 年 7 月佢回顧自己曾經喺和記一路下跌時加碼，結果資本大幅縮水，藉此警告讀者唔好溝落。", "sections": [["平均價下降，風險可以上升", "同一隻股票買多咗，平均成本可能較低，但投入金額亦更大。你需要睇總損失，而唔只係平均買入價。"], ["唔同策略要分清", "本文討論佢嘅個股交易思路。預先設定、分散投資嘅定期供款，唔可以單憑同一個「買多啲」動作就視為完全相同策略。"]], "example": "自設例子：$10 買 100 股，再喺 $8 買 100 股，平均價係 $9。若之後跌至 $6，總虧損係 $600；只保留原來 100 股則虧損 $400。未計費用。", "task": "每次想加碼時，先寫「新增證據」同「新增最壞損失」。", "question": "溝落之後平均成本低咗，係咪代表總風險一定低咗？", "options": ["一定係。", "唔一定，持倉金額可能增加。"], "answer": 1, "explanation": "平均成本同總風險係兩回事。新增持倉可能令可損失金額更大。", "sources": [{"label": "2008-07-17 · 兩房變成植物人", "url": "https://chaozmarket.blogspot.com/2008/07/2008-07-17.html", "kind": "原文"}], "case": {"lesson": "1-2", "title": "SVB：救存戶，唔等於救股東", "period": "2023-03", "known": "2023-03-12", "checked": "2026-10-05", "facts": ["SVB 被接管後，美國當局宣布保護存戶；聲明明確指出股東與部分無抵押債權人不獲保護。"], "connection": "「政府會救」唔係溝貨理由。先分清自己持有嘅係存款、股票定債券，各自法律與經濟地位不同。", "question": "存戶獲保護，銀行普通股投資者可以推斷乜？", "options": ["股價一定回本。", "所有金融產品都受保。", "唔能推斷普通股亦獲保護。"], "answer": 2, "explanation": "保護對象不同。股票仍承受股東損失，唔好將政策標題當成攤低成本依據。", "limits": "呢個係美國個案；唔能直接套用到香港存款保障或其他國家。", "sources": [{"label": "FDIC｜2023-03-12 聯合聲明", "url": "https://www.fdic.gov/news/press-releases/2023/pr23017.html"}], "calculation": null}}, {"id": "1-3", "number": "1.3", "chapter": "mindset", "title": "向錯誤學習：技術指標唔係保證", "desc": "用作者自己嘅反思理解方法嘅限制。", "takeaway": ["有指標，仍然可以睇錯。", "一個例子唔足以證明普遍規律。", "學原則，亦要查執行同結果。"], "author": "2008 年 12 月佢回顧溝落股票同沽空超買黃金嘅損失，並提出希望將經驗整理成可以系統化嘅交易方法。", "sections": [["經驗同系統有距離", "好文章可以幫你提出問題，但如果入市、離場、注碼等條件未寫清楚，兩個讀者可能做出完全唔同交易。"], ["閱讀時留兩欄", "一欄寫作者講咗乜；另一欄寫仲欠乜資料。例如何時執行、實際成交價、期間有冇轉倉。唔好用猜測補成績。"]], "example": "一個訊號可能喺某次危機有用，但喺橫行市反覆觸發。先記錄訊號，再比較唔同時期，先有機會知道適用範圍。", "task": "讀一篇原文，列出一個有講清楚嘅規則，同一個未講清楚嘅執行細節。", "question": "作者寫得有說服力，可以代替交易紀錄嗎？", "options": ["可以。", "唔可以，仲要睇規則同證據。"], "answer": 1, "explanation": "敘事可以啟發思考，但唔等於已驗證嘅回報。", "sources": [{"label": "2008-12-15 · 全球信用卡利率repricing", "url": "https://chaozmarket.blogspot.com/2008/12/2008-12-15.html", "kind": "原文"}], "case": {"lesson": "1-3", "title": "Kraft Heinz：名家亦要面對減值", "period": "2025 第二季", "known": "2025 第二季財報；2025 年報再確認", "checked": "2026-10-05", "facts": ["Berkshire 在 2025 年第二季為 Kraft Heinz 持股確認約 50 億美元稅前減值。"], "connection": "欣賞名家可以幫你學研究，但唔能取代自己嘅風險檢查。減值提醒原先估值亦可能需要修正。", "question": "呢個案例可以證明邊一點？", "options": ["名家投資都唔會錯。", "名家持倉亦有風險，需要檢查。", "所有食品公司都唔值得研究。"], "answer": 1, "explanation": "一項減值反映特定投資嘅問題，唔足以否定全部策略，亦唔支持盲目崇拜。", "limits": "會計減值唔等於該日賣出嘅已實現損失；唔係整個 Berkshire 組合回報。", "sources": [{"label": "Berkshire｜2025 年報（2026 年刊發）", "url": "https://www.berkshirehathaway.com/2025ar/2025ar.pdf"}], "calculation": null}}, {"id": "2-1", "number": "2.1", "chapter": "trend", "title": "相對強勢：同邊個比較？", "desc": "唔只問有冇升，仲要問跑贏邊個。", "takeaway": ["先定比較基準同時段。", "升得多同跌得少都可能係相對強勢。", "相對強勢唔等於 RSI。"], "author": "2008 年 8 月佢明確介紹動力投資：偏向相對強勢嘅資產同板塊，領導地位逆轉時亦要改變選擇。", "sections": [["比較先有意思", "比較要用同一段時間。如果一隻股票睇一年，另一隻只睇一星期，結果唔係公平排名。"], ["兩個概念唔好混淆", "相對強勢係同其他股票或指數比較；RSI 係根據自身近期升跌計算嘅動量指標。呢度係術語解釋，唔係將兩者當成同一條買入訊號。"]], "example": "自設例子：同一個月，指數跌 8%，甲股跌 2%，乙股跌 12%。甲股相對指數較強，但甲股本身仍然蝕錢。", "task": "寫低你用邊個基準、比較幾長時間，再研究排名。", "question": "相對指數較強，係咪即係一定有正回報？", "options": ["係。", "唔係，可能只係跌得少。"], "answer": 1, "explanation": "相對表現好唔等於絕對表現一定賺錢。", "sources": [{"label": "2008-08-22 · 小心非理性悲觀", "url": "https://chaozmarket.blogspot.com/2008/08/2008-08-22.html", "kind": "原文"}], "case": {"lesson": "2-1", "title": "2025 美股：細股唔係永遠較強", "period": "2025 全年", "known": "2026 年發布嘅年度比較", "checked": "2026-10-05", "facts": ["S&P DJI 報告指，2025 年標普 500 表現較中型股指數高約 10 個百分點，較小型股指數高約 12 個百分點。"], "connection": "曹仁超有些年份偏向二線股，但相對強勢要用同一時段與基準重新比較，唔係固定買細股。", "question": "今年發現大型股較強，應點處理以前偏好細股嘅規則？", "options": ["照舊認定細股一定跑贏。", "用同時段數據重新檢查。", "將不同年期回報直接混排。"], "answer": 1, "explanation": "相對排名會變。百分點差異唔係個別股票必然回報。", "limits": "比較係指數，唔代表每隻大股都跑贏每隻細股；亦唔係未來預測。", "sources": [{"label": "S&P DJI｜SPIVA 美國 2025 年底報告", "url": "https://www.spglobal.com/spdji/en/spiva/article/spiva-us-year-end-2025/"}], "calculation": null}}, {"id": "2-2", "number": "2.2", "chapter": "trend", "title": "50 天線與 250 天線", "desc": "學一條原文有明確提到嘅趨勢篩選規則。", "takeaway": ["原文用 50 天線高於 250 天線作篩選。", "平均線係歷史價格，唔係預知未來。", "篩選通過後仍要研究風險。"], "author": "2008 年 2 月佢提出買 50 天移動平均線高於 250 天線嘅股份，避開相反情況；熊市嘅例外操作亦只宜小注。", "sections": [["呢條規則回答乜？", "佢幫你分辨短中期平均價格相對長期平均價格嘅位置。佢唔會直接話你公司值幾多，亦唔會保證下一日股價上升。"], ["執行要定義", "做測試之前，先寫清楚用收市價定盤中價、簡單平均定其他算法，同埋幾時落單。唔好事後揀最有利嘅版本。"]], "example": "自設例子：50 天平均 $12，250 天平均 $10，符合呢個位置條件；如果兩者係 $9 同 $10，就唔符合。通過唔代表要即刻買。", "task": "用一隻股票練習讀平均線，寫低數值同日期；唔使落真盤。", "question": "50 天線高於 250 天線，最準確嘅理解係？", "options": ["股價一定繼續升。", "符合一項歷史趨勢篩選條件。"], "answer": 1, "explanation": "呢個係篩選條件，唔係回報承諾。", "sources": [{"label": "2008-02-25 · 小心第二隻鞋", "url": "https://chaozmarket.blogspot.com/2008/02/2008-02-25.html", "kind": "原文"}], "case": {"lesson": "2-2", "title": "2025 港股急跌：一個收市價唔係均線", "period": "2025-04-07", "known": "2025-04-07 收市報道", "checked": "2026-10-05", "facts": ["恒指當日收 19,828.30 點，較前一交易日跌 13.22%。"], "connection": "呢個真實收市點只交代一日變化。要檢查 50 天與 250 天線，仍需要足夠交易日、相同價格口徑與預先設定嘅計法。", "question": "只用呢一日資料，可否確認 50 天線已跌穿 250 天線？", "options": ["可以，大跌就一定係。", "唔可以，要用完整日線計算。"], "answer": 1, "explanation": "單日跌幅唔等於均線交叉。缺數據時，應記錄未能確認，而唔係補一個訊號。", "limits": "本案例冇重建實際交叉日期；唔宣稱均線當日發出買賣訊號。", "sources": [{"label": "新華社香港記者｜2025-04-07 市場收市報道", "url": "https://www.xinhuanet.com/gangao/20250407/cb0c4cca7e224ddbb272061ea89e3baf/c.html"}], "calculation": null}}, {"id": "2-3", "number": "2.3", "chapter": "trend", "title": "反彈，未必係新牛市", "desc": "分清一段短升浪同持續上升趨勢。", "takeaway": ["短期反彈唔足以證明長期轉勢。", "博反彈要預設離場條件。", "唔好輸咗就改口話長線。"], "author": "2008 年 9 月嘅反彈交易討論，著重動力股、入市時機、可承受風險、止蝕位同目標到達後獲利。", "sections": [["入市前先揀玩法", "你係研究長期趨勢，定係短期反彈？兩者觀察時段同離場方法可以唔同。用途未定，單一訊號就容易被過度解讀。"], ["避免事後改口", "如果交易本來只係捕捉反彈，跌穿計劃條件後改稱「等幾年」，其實係更換咗風險承諾。"]], "example": "自設例子：一隻股票由 $20 跌至 $10，再升至 $12，反彈 20%，但仍然低於原高位 40%。升幅同完整趨勢係兩個問題。", "task": "為一個假想買入，寫清楚「趨勢交易」或「反彈交易」。", "question": "跌一半之後反彈兩成，是否已經回到原價？", "options": ["係。", "唔係。"], "answer": 1, "explanation": "$20 跌至 $10，再升兩成只係 $12。", "sources": [{"label": "2008-09-08 · 兩房被「托管」而非「接管」", "url": "https://chaozmarket.blogspot.com/2008/09/2008-09-08.html", "kind": "原文"}], "case": {"lesson": "2-3", "title": "SVB：政策反應唔能確認新牛市", "period": "2023-03", "known": "2023-03-12", "checked": "2026-10-05", "facts": ["美國當局在 SVB 與 Signature Bank 事件後公布存款保障措施。"], "connection": "政策可以處理眼前危機，但「有救助」本身唔能回答企業盈利、信貸及價格趨勢是否持續改善。", "question": "見到救助消息，可以立即得出新牛市開始嗎？", "options": ["可以，政府行動等於升市保證。", "唔可以，仍要檢查持續轉勢證據。"], "answer": 1, "explanation": "政策事件同持續趨勢係兩個問題，唔應靠單一新聞定義牛熊。", "limits": "唔推算事件後股價反彈幅度，亦唔宣稱當時已確認牛熊轉換。", "sources": [{"label": "FDIC｜2023-03-12 聯合聲明", "url": "https://www.fdic.gov/news/press-releases/2023/pr23017.html"}], "calculation": null}}, {"id": "3-1", "number": "3.1", "chapter": "picking", "title": "先揀行業，再比較龍頭", "desc": "將宏觀觀點變成可研究嘅公司名單。", "takeaway": ["研究行業因素，唔只睇大市。", "龍頭地位要有比較證據。", "好行業唔代表每間公司都好。"], "author": "2008 年 1 月佢強調行業盛衰同龍頭股，並用買入時間、市場同股份選擇去拆解投資決策。", "sections": [["由大題目縮細", "先寫邊項因素影響行業，再比較同業。例如成本上升會唔會轉嫁畀客戶？需求係持續定一次性？以下係研究問題，唔係原文對現時板塊嘅推介。"], ["龍頭唔只係市值大", "做延伸研究時，可以比較市場份額、利潤率、現金流同債務。邊項指標最合適，要睇行業特性。"]], "example": "同一行業嘅甲公司可以加價，乙公司只能減價搶客。研究差異比單憑「呢個板塊熱門」更具體。", "task": "揀一個你熟悉嘅行業，列出三間公司同兩項比較指標。", "question": "板塊熱門，是否足以證明其中一隻股票值得買？", "options": ["足夠。", "唔足夠，仍要比較公司同價位。"], "answer": 1, "explanation": "行業研究係起點，唔係個股結論。", "sources": [{"label": "2008-01-17 · 250天線支持區", "url": "https://chaozmarket.blogspot.com/2008/01/2008-01-17.html", "kind": "原文"}], "case": {"lesson": "3-1", "title": "AI 同一主題，NVIDIA 與 Intel 業績不同", "period": "NVIDIA FY2026／Intel 2025", "known": "兩份公告均於 2026 年初公布", "checked": "2026-10-05", "facts": ["NVIDIA FY2026 營收按年增 65%；Intel 2025 年營收按公司口徑持平。"], "connection": "同屬晶片相關企業，盈利引擎、客戶同業務結構可以不同。先選行業，再研究公司，唔好買晒所有有 AI 標籤嘅股份。", "question": "呢兩個數字最有用嘅用途係？", "options": ["證明所有晶片股回報相同。", "直接比較股價升幅。", "提醒要研究個別公司，而唔只買主題。"], "answer": 2, "explanation": "呢度係營收比較，唔係股價走勢；更唔係直接估值排名。", "limits": "兩家公司財年結束日不同；營收增幅唔等於利潤、現金流或投資回報。", "sources": [{"label": "NVIDIA｜FY2026 業績（2026-02-25）", "url": "https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-Financial-Results-for-Fourth-Quarter-and-Fiscal-2026/"}, {"label": "Intel｜2025 全年業績（2026-01-22）", "url": "https://www.intc.com/news-events/press-releases/detail/1759/intel-reports-fourth-quarter-and-full-year-2025-financial"}], "calculation": null}}, {"id": "3-2", "number": "3.2", "chapter": "picking", "title": "公司質素：利潤率、負債與盈利", "desc": "理解作者介紹嘅 Robertson 揀股框架。", "takeaway": ["同業比較比單睇一個數字更有用。", "負債同盈利持續性要一齊睇。", "框架有來源，唔好誤當成永久禁買清單。"], "author": "2008 年 12 月佢讚賞 Julian Robertson 嘅揀股清單，包括同業中較高利潤率、低負債、盈利同增長估值。文中行業排除屬該清單。", "sections": [["數字要可比較", "利潤率可以係毛利率、營業利潤率或淨利率；比較之前，先確定用同一種定義同期間。"], ["延伸核對", "本課額外研究問題：盈利有幾多變成現金？債務幾時到期？公司需唔需要不斷融資？呢啲係補充分析，唔係聲稱原文逐項要求。"]], "example": "兩間公司純利相同，但一間主要靠經營，另一間主要靠一次性出售資產。下一年可否重複，係你要核對嘅問題。", "task": "睇一份年報，分開經常盈利、一次性項目同債務到期資料。", "question": "同業利潤率比較，應該先確定乜？", "options": ["數字用同一定義同期間。", "公司名稱夠唔夠出名。"], "answer": 0, "explanation": "唔同口徑嘅數字會令比較失真。", "sources": [{"label": "2008-12-29 · 2009低買高賣年", "url": "https://chaozmarket.blogspot.com/2008/12/2008-12-29.html", "kind": "原文"}], "case": {"lesson": "3-2", "title": "台積電：收入增長之外，檢查利潤率", "period": "2025 全年", "known": "2026 年刊發嘅 2025 年報", "checked": "2026-10-05", "facts": ["以新台幣計，2025 年收入增 31.6%；毛利率 59.9%，上年為 56.1%。"], "connection": "收入增長同毛利率改善，可以成為進一步研究線索。但仍要查資本開支、負債、客戶集中度及估值。", "question": "毛利率升咗幾多？", "options": ["3.8 個百分點。", "59.9%。", "一定等於股價升幅。"], "answer": 0, "explanation": "59.9 − 56.1 = 3.8 個百分點。毛利率變化同股價回報並非同一數字。", "limits": "唔同會計、產業模式唔宜直接套相同利潤率門檻；亦唔代表股份現價便宜。", "sources": [{"label": "台積電｜2025 年報", "url": "https://investor.tsmc.com/static/annualReports/2025/english/index.html"}], "calculation": null}}, {"id": "3-3", "number": "3.3", "chapter": "picking", "title": "P/E 低，未必真係平", "desc": "用 PEG 例子理解增長預期。", "takeaway": ["P/E 同增長要一齊研究。", "PEG 係除法，唔係加法。", "增長預測錯，估值比較亦會錯。"], "author": "本課承接前一課嘅估值概念；以下公式用 Fidelity 嘅定義核對，唔沿用博客中將 PEG 寫成加法嘅表述。", "sections": [["點樣計 PEG？", "常見計法係 P/E ÷ 盈利增長率，增長率用百分點數字。例如 20% 用 20，而唔係 0.20。使用過去定預測增長、幾多年平均，都要寫清楚。"], ["比率唔係結論", "即使 PEG 較低，仍要問增長能否持續、會唔會靠一次性因素，亦要核對負債同價格風險。負增長或零增長時，簡單比較尤其有限。"]], "example": "自設例子：甲股 P/E 20、預期增長 20%，PEG = 1；乙股 P/E 10、預期增長 2%，PEG = 5。乙股 P/E 較低，但增長調整後唔一定較吸引。", "task": "做一次計算，再將增長預期減半，觀察 PEG 點變。", "question": "P/E 15、增長 10%，PEG 係幾多？", "options": ["25", "1.5", "150"], "answer": 1, "explanation": "15 ÷ 10 = 1.5。預期增長本身仍需要證據。", "sources": [{"label": "Fidelity：公司估值比率與 PEG", "url": "https://www.fidelity.com/learning-center/trading-investing/fundamental-analysis/company-valuation-ratios", "kind": "補充資料"}], "case": {"lesson": "3-3", "title": "Intel：虧損公司嘅 P/E 點讀？", "period": "2025 全年", "known": "2026-01-22", "checked": "2026-10-05", "facts": ["Intel 全年 GAAP 每股虧損 0.06 美元；non-GAAP 每股盈利為 0.42 美元。"], "connection": "你用邊個盈利口徑，會改變估值判斷。GAAP 虧損時，傳統正數市盈率比較唔適用；調整後盈利亦要查調節表。", "question": "看到負 P/E，應該當成比 5 倍 P/E 更便宜嗎？", "options": ["應該，數字越小越好。", "唔應該，先分清虧損與盈利口徑。"], "answer": 1, "explanation": "分母為負數時，唔能沿用正盈利公司嘅低 P/E 排名。", "limits": "冇引用當日股價，亦冇計實際 P/E；non-GAAP 唔可以當成所有公司完全相同口徑。", "sources": [{"label": "Intel｜2025 全年業績（2026-01-22）", "url": "https://www.intc.com/news-events/press-releases/detail/1759/intel-reports-fourth-quarter-and-full-year-2025-financial"}], "calculation": null}}, {"id": "4-1", "number": "4.1", "chapter": "risk", "title": "止蝕：先分清由邊個價位計", "desc": "入市價止蝕同高位回落止蝕唔係同一件事。", "takeaway": ["先定參考價，再定百分比。", "15% 同 20% 係歷史文章嘅門檻。", "止蝕觸發價唔保證成交價。"], "author": "8 月文章提到由高位回落約 15% 離場；10 月文章提到跌 15% 考慮止蝕、20% 止蝕。兩段唔可以無條件當成同一條規則。", "sections": [["兩條規則點分？", "由買入價計，係控制最初嘅價差；由其後高位計，係追蹤盈利回吐。落單前要寫清楚基準同觸發方式。"], ["執行限制", "SEC 提醒，止蝕單觸發後可以喺較差價格成交；限價止蝕單亦可能完全成交唔到。百分比唔等於損失上限。"]], "example": "自設例子：$100 買入，升至 $140。由買入價跌 15% 係 $85；由新高跌 15% 係 $119。兩個門檻差距好大。", "task": "寫低一條完整退出規則：參考價、幅度、觀察時間同落單方式。", "question": "股價由 $140 高位回落 15%，門檻係？", "options": ["$119", "$85", "$125"], "answer": 0, "explanation": "$140 × 0.85 = $119。呢個唔係保證成交價。", "sources": [{"label": "2008-08-01 · 港股玩細細粒容易食", "url": "https://chaozmarket.blogspot.com/2008/08/2008-08-01.html", "kind": "原文"}, {"label": "2008-10-11 · 萬四漸見支持", "url": "https://chaozmarket.blogspot.com/2008/10/2008-10-11.html", "kind": "原文"}, {"label": "SEC：止蝕、限價止蝕與移動止蝕", "url": "https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-bulletins-15", "kind": "補充資料"}], "case": {"lesson": "4-1", "title": "SVB：止蝕指令唔係成交保證", "period": "2023-03", "known": "2023-04-28 官方檢討", "checked": "2026-10-05", "facts": ["聯儲局檢討指 SVB 在 3 月 9 日流出超過 400 億美元存款，銀行翌日被關閉。"], "connection": "極端事件提醒你，要分清退出觸發同實際可成交價格。SEC 亦說明止蝕市價單成交價可能偏離觸發價。", "question": "設定止蝕價後，可以保證最多只蝕到嗰個價嗎？", "options": ["可以，設定即保證成交。", "唔可以，流動性與價格跳動仍有影響。"], "answer": 1, "explanation": "止蝕係執行安排，唔係保險。限價止蝕亦有可能未能成交。", "limits": "本案例唔重建任何個人實際落單；唔宣稱某個止蝕價在 SVB 曾可成交。", "sources": [{"label": "聯儲局｜SVB 檢討（2023-04-28）", "url": "https://www.federalreserve.gov/publications/2023-April-SVB-Key-Takeaways.htm"}, {"label": "SEC｜止蝕與限價止蝕投資者公告", "url": "https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-bulletins-15"}], "calculation": null}}, {"id": "4-2", "number": "4.2", "chapter": "risk", "title": "注碼：先計一次可以蝕幾多", "desc": "用總資金損失，反推持倉股數。", "takeaway": ["個股跌幅唔等於組合跌幅。", "先定金額風險，再計股數。", "多個同類持倉可以一齊跌。"], "author": "原文重視可承受風險；本課嘅注碼公式同數值係教學延伸，唔係聲稱曹仁超指定每次只冒某個百分比風險。", "sections": [["計法", "計劃股數 = 可承受嘅計劃損失金額 ÷ 每股買入價與退出價差，再向下取整。計劃損失唔包括所有跳空或成交風險。"], ["亦要睇組合", "五隻同一行業股票未必代表風險分散。你要另外檢查行業集中度、相關性同最壞情況。"]], "example": "自設港元例子：總資金 $100,000，假設計劃承受 $500 損失；$10 買入、$8.50 退出。可買 333 股，成本 $3,330，計劃價差損失 $499.50。未計每手股數、費用同跳空。", "task": "用假想數字計一次，並檢查香港股票每手股數會點影響落單。", "question": "每股計劃損失 $2、金額風險 $600，可買幾多股（未計每手限制）？", "options": ["300 股", "600 股", "1,200 股"], "answer": 0, "explanation": "$600 ÷ $2 = 300 股；實際落單仲要考慮每手限制同費用。", "sources": [{"label": "2008-09-08 · 兩房被「托管」而非「接管」", "url": "https://chaozmarket.blogspot.com/2008/09/2008-09-08.html", "kind": "原文"}, {"label": "SEC：資產配置與分散投資", "url": "https://www.investor.gov/introduction-investing/getting-started/asset-allocation", "kind": "補充資料"}], "case": {"lesson": "4-2", "title": "2025 港股急跌：三成倉同滿倉差幾多？", "period": "2025-04-07", "known": "2025-04-07 收市報道", "checked": "2026-10-05", "facts": ["當日恒指跌 13.22%。以下用呢個市場變幅做倉位算術，唔係任何人真實帳戶。"], "connection": "同一種市場跌幅，持倉比例會改變組合損失。計算要先交代其餘資產、費用與所持產品是否追蹤指數。", "question": "假設十萬港元、三成完全跟恒指，其餘現金不變，損失約幾多？", "options": ["13,220 港元。", "3,966 港元。", "396.6 港元。"], "answer": 1, "explanation": "100,000 × 30% × 13.22% = 3,966。呢個係情境算術，未計費用及追蹤差異。", "limits": "個股可以跌更多；現金及其他資產亦未必完全不變。", "sources": [{"label": "新華社香港記者｜2025-04-07 市場收市報道", "url": "https://www.xinhuanet.com/gangao/20250407/cb0c4cca7e224ddbb272061ea89e3baf/c.html"}], "calculation": {"label": "教學假設：10 萬港元組合，套用已發生嘅指數跌幅", "rows": [["股票比例", "估算組合損失"], ["30%", "HK$3,966"], ["60%", "HK$7,932"], ["100%", "HK$13,220"]]}}}, {"id": "4-3", "number": "4.3", "chapter": "risk", "title": "現金：留低下一次選擇權", "desc": "理解危機時減少曝險嘅作用同代價。", "takeaway": ["現金可以減少組合波動。", "留現金亦可能錯過反彈。", "歷史比例唔等於你適用嘅比例。"], "author": "2008 年 7 月佢提出熊市只用約三成資金、保留七成現金，為之後機會保存資本。呢個係當年情境下嘅部署。", "sections": [["現金嘅作用", "無持倉嘅部分唔會承受該股票嘅價差損失，但現金亦有通脹、利息同機會成本問題。"], ["配置要跟目標", "SEC 嘅補充資料強調年期、目標同承受虧損能力。唔好直接將一篇金融危機文章嘅比例套落自己所有資金。"]], "example": "自設例子：$100,000 中 $30,000 係股票。如果股票跌 40%，呢部分損失 $12,000；其餘現金唔變，組合剩 $88,000。未計利息、股息同交易。", "task": "寫低你嘅資金用途同年期，再思考點樣衡量配置；先唔急住定比例。", "question": "持有現金可以保證完全冇風險嗎？", "options": ["可以。", "唔可以，仍有通脹同機會成本等問題。"], "answer": 1, "explanation": "現金改變風險種類，唔代表消除所有風險。", "sources": [{"label": "2008-07-17 · 兩房變成植物人", "url": "https://chaozmarket.blogspot.com/2008/07/2008-07-17.html", "kind": "原文"}, {"label": "SEC：資產配置與分散投資", "url": "https://www.investor.gov/introduction-investing/getting-started/asset-allocation", "kind": "補充資料"}], "case": {"lesson": "4-3", "title": "Berkshire：龐大流動資金有自己嘅原因", "period": "2025 年底", "known": "2026 年刊發嘅 2025 年報", "checked": "2026-10-05", "facts": ["保險及其他業務年底持有現金、等價物與美國國庫券約 3,690 億美元，已扣未交收購入應付款。"], "connection": "流動性可以支持保險責任同投資機會。你嘅資金用途、年期與收入來源，未必同一家保險集團相同。", "question": "見到呢個現金額，個人投資者應該直接照搬比例嗎？", "options": ["應該，名家比例適用所有人。", "唔應該，先理解負債與資金用途。"], "answer": 1, "explanation": "現金部署要配合責任同目標；單一金額唔提供適合你嘅配置比例。", "limits": "國庫券唔等同銀行活期；呢個範圍亦唔係單純整個集團所有現金。", "sources": [{"label": "Berkshire｜2025 年報（2026 年刊發）", "url": "https://www.berkshirehathaway.com/2025ar/2025ar.pdf"}], "calculation": null}}, {"id": "5-1", "number": "5.1", "chapter": "execution", "title": "趨勢交易：讓盈利有空間", "desc": "唔好用固定細目標截斷所有升浪。", "takeaway": ["趨勢交易要有持有同退出條件。", "盈利增加唔代表風險消失。", "追蹤退出價要寫清楚計法。"], "author": "2008 年 8 月佢用跟隨升勢同由高位回落退出，說明讓盈利延伸嘅思路。", "sections": [["實際要定義乜？", "本課延伸要求：入市條件、更新高位嘅時點、退出觸發同重新入市方法。單靠「止蝕唔止賺」未足以執行。"], ["加碼唔係免費", "如果你喺盈利後加碼，新增股份仍可蝕錢。加碼之後要重新計整體風險，唔好只望平均成本同未實現盈利。"]], "example": "自設例子：由 $20 升至 $30，若使用自設 10% 高位回落規則，退出觸發係 $27。若高位再升至 $40，觸發就變成 $36。10% 只係例子。", "task": "為一段假想上升走勢，記低每次高位同對應退出觸發價。", "question": "追蹤止蝕最需要先定乜？", "options": ["每次想要賺幾多。", "高位基準、更新時間同觸發方式。"], "answer": 1, "explanation": "基準未定，規則就可能喺臨場被改寫。", "sources": [{"label": "2008-08-01 · 港股玩細細粒容易食", "url": "https://chaozmarket.blogspot.com/2008/08/2008-08-01.html", "kind": "原文"}, {"label": "SEC：止蝕、限價止蝕與移動止蝕", "url": "https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-bulletins-15", "kind": "補充資料"}], "case": {"lesson": "5-1", "title": "NVIDIA 拆股：追蹤止蝕要用同一基準", "period": "2024-06", "known": "2024-05 宣布；6 月實施", "checked": "2026-10-05", "facts": ["NVIDIA 進行一拆十，股份於 2024 年 6 月 10 日開始以拆股後口徑交易。"], "connection": "拆股前後嘅股數、成本、高位同退出價需要一致調整。原始股價降低唔代表投資突然虧損九成。", "question": "假設拆股前追蹤觸發價係 900 美元，一拆十後等價觸發價係？", "options": ["900 美元。", "90 美元。", "9 美元。"], "answer": 1, "explanation": "900 ÷ 10 = 90。呢個係口徑換算，唔係 NVIDIA 真實止蝕設定。", "limits": "券商對待未成交單嘅做法可能不同，要核對；換算唔代表能以該價成交。", "sources": [{"label": "NVIDIA｜2024 拆股 FAQ", "url": "https://investor.nvidia.com/files/doc_downloads/2024/06/nvidia-2024-stock-split_faq_investors.pdf"}], "calculation": null}}, {"id": "5-2", "number": "5.2", "chapter": "execution", "title": "博反彈：目標到咗點做？", "desc": "唔好將短期交易拖成無限期持有。", "takeaway": ["目標、退出同年期要預先寫。", "達到目標後唔好臨場無限加高。", "反彈同趨勢交易可以用唔同退出方法。"], "author": "2008 年 9 月嘅五項交易問題包括目標到達後獲利回吐。呢個要放返當時博反彈嘅語境理解。", "sections": [["先寫交易票", "本課練習用買入、退出、目標同預期觀察時間四格，避免入市後先決定自己玩邊一種策略。"], ["風險回報比有限制", "目標價差除以退出價差可以描述計劃，但唔包含成功機率，亦唔保證你可以喺目標成交。"]], "example": "自設例子：$10 入、$9 退出、$12 目標，計劃上升空間 $2、下降空間 $1，比例 2:1。但如果命中率好低，仍可能輸錢。", "task": "填一張假想交易票，並寫低條件改變時點處理。", "question": "計劃風險回報 2:1，是否足以證明有利可圖？", "options": ["足以。", "唔足以，仲欠成功機率同成本。"], "answer": 1, "explanation": "回報幅度、成功機率同成本要一齊考慮。", "sources": [{"label": "2008-09-08 · 兩房被「托管」而非「接管」", "url": "https://chaozmarket.blogspot.com/2008/09/2008-09-08.html", "kind": "原文"}], "case": {"lesson": "5-2", "title": "港交所：好業績唔等於達到交易目標", "period": "2025 全年", "known": "2026-02-26", "checked": "2026-10-05", "facts": ["2025 年收入與其他收益增 30%；股東應佔溢利增 36%。"], "connection": "如果你本來做短期反彈，業績好唔應成為無限期延後退出嘅藉口。要分清盈利數字、股價目標及策略年期。", "question": "你嘅短線交易已到預先設定目標，見到好業績應點做？", "options": ["無條件將目標一直提高。", "按原計劃處理，另作新研究先改策略。", "將短線自動改成永遠持有。"], "answer": 1, "explanation": "調整策略需要新理由與完整計劃，唔係將到達目標後嘅決策交畀情緒。", "limits": "案例冇提供真實買入、目標及成交價；公司盈利增幅唔等於股價升幅。", "sources": [{"label": "港交所｜2025 全年業績（2026-02-26）", "url": "https://www.hkex.com.hk/-/media/HKEX-Market/News/News-Release/2026/260226news/260226news_eng.pdf"}], "calculation": null}}, {"id": "5-3", "number": "5.3", "chapter": "execution", "title": "交易日誌：留下當時嘅證據", "desc": "用紀錄分辨睇錯同冇跟規則。", "takeaway": ["記決定時已知資料。", "分開策略結果同執行偏差。", "記錄全部交易，唔只記贏錢嗰啲。"], "author": "呢課係將前面嘅紀律概念轉成學習工具，唔係轉述一篇原文提供嘅完整日誌格式。", "sections": [["最少記六樣", "日期、理由、訊號、注碼、退出條件同結果。加一欄「有冇跟計劃」，可以更容易分辨方法本身同執行問題。"], ["成本亦要記", "佣金、差價同其他費用會改變實際結果。SEC 嘅費用資料解釋成本如何影響累積回報。"]], "example": "同樣虧損 $500，一次係完全跟計劃，一次係無限溝落先蝕。只睇最終金額，會漏咗重要行為差異。", "task": "用紙上交易做一個星期紀錄，唔需要真實買賣。", "question": "點樣嘅日誌較有用？", "options": ["只留成功交易。", "留全部交易同當時決策理由。"], "answer": 1, "explanation": "只記贏錢會令你高估方法，亦睇唔到重複出錯嘅地方。", "sources": [{"label": "SEC：投資費用", "url": "https://www.investor.gov/introduction-investing/getting-started/understanding-fees", "kind": "補充資料"}], "case": {"lesson": "5-3", "title": "Intel：日誌要保留兩套盈利口徑", "period": "2025 全年", "known": "2026-01-22", "checked": "2026-10-05", "facts": ["同一份公告嘅 GAAP EPS 為 −0.06 美元，non-GAAP EPS 為 0.42 美元。"], "connection": "紙上日誌可以記：當時使用邊個數字、調整項目、原先假設同重估條件。之後唔可以事後換分母令原決定看似一直正確。", "question": "最值得喺日誌補邊一欄？", "options": ["只記後來最好看嘅盈利數字。", "記盈利口徑、資料日期及當時理由。"], "answer": 1, "explanation": "同一個案例可以有不同研究方法；先留清楚當時選擇，先能公平檢討。", "limits": "只係教學日誌示範，唔係 Intel 或作者真實交易紀錄。", "sources": [{"label": "Intel｜2025 全年業績（2026-01-22）", "url": "https://www.intc.com/news-events/press-releases/detail/1759/intel-reports-fourth-quarter-and-full-year-2025-financial"}], "calculation": null}}, {"id": "6-1", "number": "6.1", "chapter": "evidence", "title": "作者講止蝕，持倉仍可以跌四成", "desc": "正面閱讀文章入面嘅落差。", "takeaway": ["主張唔等於已完成執行。", "剩餘持倉跌幅唔等於全組合跌幅。", "資料不足時，唔好編出完整成績。"], "author": "2008 年 10 月佢提到原來三成資金買入嘅股票已跌約四成，股票比例變成約兩成。原文未交代完整交易紀錄。", "sections": [["應該點解讀？", "呢個落差值得研究，但唔足以推斷所有交易點執行、整體回報係幾多，或者每條止蝕規則係咪失效。"], ["用數學核對量級", "可以做簡化例子，但要寫清楚假設。唔好將例子當成作者已審核嘅帳戶報表。"]], "example": "假設起初 70 現金、30 股票，股票跌 40%，剩 70 + 18 = 88；股票比例係 18 ÷ 88 ≈ 20.5%。呢個只係示範比例變化。", "task": "將一個投資故事分成「已知事實」「自己推算」「仍然未知」三欄。", "question": "原文持倉跌四成，能否直接話全部資產都跌四成？", "options": ["可以。", "唔可以，要知道持倉比例同其他變動。"], "answer": 1, "explanation": "個股或股票部分嘅回報，唔可以直接當成全部資產回報。", "sources": [{"label": "2008-10-11 · 萬四漸見支持", "url": "https://chaozmarket.blogspot.com/2008/10/2008-10-11.html", "kind": "原文"}], "case": {"lesson": "6-1", "title": "Meta：營業盈利同淨利唔係同一件事", "period": "2025 全年", "known": "2026-01-28", "checked": "2026-10-05", "facts": ["Meta 營業盈利增 20%，淨利卻跌 3%；公告交代全年稅項包含稅法實施影響。"], "connection": "好似「股票持倉跌四成」唔等於「全部資產跌四成」，唔同盈利層次亦唔能混用。先檢查數字範圍與橋接項目。", "question": "淨利下跌，可以直接推斷營運同幅度轉差嗎？", "options": ["可以，兩者完全一樣。", "唔可以，先看營業結果、稅項與其他因素。"], "answer": 1, "explanation": "數字都有範圍。先核對由營業盈利到淨利嘅差異，先能解讀變化。", "limits": "案例唔推斷股價表現，亦唔將稅項影響一律視為可以忽略。", "sources": [{"label": "Meta｜2025 全年業績（2026-01-28）", "url": "https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Fourth-Quarter-and-Full-Year-2025-Results/default.aspx"}], "calculation": null}}, {"id": "6-2", "number": "6.2", "chapter": "evidence", "title": "回本數學：跌一半，要升一倍", "desc": "認識回撤點樣影響之後嘅路。", "takeaway": ["跌幅同回本升幅唔對稱。", "計算基數變細，回本要求就變高。", "保本唔代表永遠唔承受波動。"], "author": "呢課係原創數學練習，用嚟理解前面嘅資本保護概念，唔係作者回報紀錄。", "sections": [["回本需要幾多？", "需要回升幅度 = 跌幅 ÷（1 − 跌幅）。跌 20% 之後要升 25%；跌 40% 要升約 66.7%；跌 50% 要升 100%。"], ["別只追問幾時回本", "先分清你係研究整個組合回撤，定某隻股票相對買入價嘅虧損。兩者可以用同一條數學公式，但代表唔同決策問題。"]], "example": "$100,000 跌到 $50,000，之後升 50% 只到 $75,000。由 $50,000 返 $100,000，需要升 100%。", "task": "計一計跌 10%、25% 同 30% 後，分別要升幾多先回本。", "question": "跌 25% 後，大概要升幾多先回本？", "options": ["25%", "33.3%", "50%"], "answer": 1, "explanation": "25% ÷ 75% ≈ 33.3%。", "sources": [], "case": {"lesson": "6-2", "title": "恒指跌 13.22%，回本唔係升 13.22%", "period": "2025-04-07", "known": "2025-04-07 收市報道", "checked": "2026-10-05", "facts": ["2025 年 4 月 7 日恒指跌 13.22%；以下只計由呢段跌幅回復原值所需升幅。"], "connection": "回升係由較細基數計算，所以跌幅同回本幅度唔對稱。唔好將數學需要誤當成市場一定會回升。", "question": "跌 13.22% 後，回復跌前水平約需要升幾多？", "options": ["13.22%。", "15.23%。", "26.44%。"], "answer": 1, "explanation": "13.22% ÷ (1 − 13.22%) ≈ 15.23%。呢個只係數學，唔係預測回本日期。", "limits": "單日價格指數變幅唔係你嘅總回報，未計股息、費用與入市日。", "sources": [{"label": "新華社香港記者｜2025-04-07 市場收市報道", "url": "https://www.xinhuanet.com/gangao/20250407/cb0c4cca7e224ddbb272061ea89e3baf/c.html"}], "calculation": {"label": "以跌前價值 100 作基準", "rows": [["階段", "價值"], ["跌前", "100"], ["跌 13.22% 後", "86.78"], ["升 13.22% 後", "約 98.25"], ["升約 15.23% 後", "約 100"]]}}}, {"id": "6-3", "number": "6.3", "chapter": "evidence", "title": "點樣驗證一套方法？", "desc": "用公平比較代替「睇落好準」。", "takeaway": ["先寫規則，再睇結果。", "唔好漏咗失敗或退市公司。", "同風險相近嘅基準比較。"], "author": "呢份學習庫未有做回測，亦未驗證曹仁超嘅超額回報。以下係延伸驗證方法。", "sections": [["避免事後知道答案", "只用當時已公布嘅資料，包含當年存在但後來退市嘅公司。事後揀返贏家，唔係公平測試。"], ["比較完整結果", "記總回報、最大回撤、交易次數、持有現金時間同成本。先定訊號，再留一段未用過嘅期間做檢驗，避免不斷調參數直到歷史好睇。"]], "example": "如果只測今日仍然存在嘅熱門股票，會漏咗當年失敗嘅公司。結果可以高估實際可得到嘅回報。", "task": "寫低你想達到嘅目標：跑贏基準、減少回撤，定完成長期儲蓄目標。三者唔係同一件事。", "question": "一套方法喺 2008 年有用，是否證明之後永遠有效？", "options": ["係。", "唔係，要驗證其他時期同成本。"], "answer": 1, "explanation": "一個時期嘅結果不足以建立長期保證。", "sources": [{"label": "SEC：投資費用", "url": "https://www.investor.gov/introduction-investing/getting-started/understanding-fees", "kind": "補充資料"}], "case": {"lesson": "6-3", "title": "SPIVA：有盈利，仍可能輸畀基準", "period": "2025 全年", "known": "2026 年發布嘅年度報告", "checked": "2026-10-05", "facts": ["S&P DJI 統計，2025 年約 79% 主動美國大型股基金跑輸標普 500。"], "connection": "驗證方法唔只看賺錢與否，仲要有合適基準、費用同完整樣本。專業經理亦可能有正回報而落後指數。", "question": "呢個數字可以證明曹仁超方法一定無效嗎？", "options": ["可以，直接證明。", "唔可以，但提醒要作公平基準比較。"], "answer": 1, "explanation": "研究對象係一組美國基金，唔係作者帳戶。它提供比較方法，唔代替特定策略測試。", "limits": "79% 指跑輸比例，唔係虧損比例；唔代表所有基金種類或所有年份。", "sources": [{"label": "S&P DJI｜SPIVA 美國 2025 年底報告", "url": "https://www.spglobal.com/spdji/en/spiva/article/spiva-us-year-end-2025/"}], "calculation": null}}, {"id": "7-1", "number": "7.1", "chapter": "years", "title": "四年部署：規則相似，倉位同焦點會變", "desc": "將歷史觀點放返當時嘅市場條件。", "takeaway": ["紀律可以延續，部署唔一定相同。", "分清原文日期同博客刊登日期。", "先問當時條件，唔好直接照搬。"], "author": "2007 年文章重視盈利增長及二線股；2008 年危機時強調現金與止蝕；2009 年轉為保護加進攻；2010 年同時討論個股、橫行部署及現金流。以下係選讀文章嘅比較，唔係完整帳戶重建。", "sections": [["2007：研究增長，尋找大回報空間", "11 月 8 日文章重視企業轉型與盈利增長；12 月 10 日討論牛眼投資法、二線股及事前研究。追求大回報係策略目標，唔等於實際每年已達成。"], ["2008：危機期間先保留資本", "9 月 17 日文章將控制投入資金、止蝕同跟隨趨勢放喺前面，並警告一般投資者唔宜隨便博反彈。年底文章開始討論橫行市同選股，唔係全年都只有同一種部署。"], ["2009：保護加進攻，但大市判斷仍有分歧", "年初主張止蝕之餘尋找機會；6 月仍提醒均線交叉唔保證新牛市。研究個股相對強勢，同對大市保持保留，可以同時存在。"], ["2010：看盈利質素，亦按自身情況配置", "7 月 5 日文章提醒盈利增長要檢查現金流；4 月 19 日文章解釋較低股票比例亦同自己年齡及承受力有關。唔好將個人比例當成適用所有人嘅公式。"]], "example": "閱讀一條「回落買入」建議時，先記市場、日期、作者判斷嘅階段同失效條件。佢喺另一段時間反對溝落，唔可以因此將兩句任意拼成交易指令。", "task": "各揀 2007、2008、2009、2010 一篇，寫低當時部署同支持理由。", "question": "同一位作者唔同年份有唔同部署，應該點讀？", "options": ["揀最樂觀嗰句永遠照用。", "比較當時條件、年期同風險。"], "answer": 1, "explanation": "倉位、焦點同時機依賴情境；唔可以忽略條件。", "sources": [{"label": "2007-11-08 · 努力射中牛眼", "url": "https://chaozmarket.blogspot.com/2007/11/2007-11-08.html", "kind": "原文"}, {"label": "2007-12-10 · 人民幣年底前或加息", "url": "https://chaozmarket.blogspot.com/2007/12/2007-12-10.html", "kind": "原文"}, {"label": "2008-09-17 · 滿街鮮血忌亂博反彈", "url": "https://chaozmarket.blogspot.com/2008/09/2008-09-17.html", "kind": "原文"}, {"label": "2009-01-03 · 大市短期仲有得升", "url": "https://chaozmarket.blogspot.com/2009/01/2009-01-03.html", "kind": "原文"}, {"label": "2010-04-19 · 美股隨時跌一成", "url": "https://chaozmarket.blogspot.com/2010/08/2010-04-19.html", "kind": "原文"}, {"label": "2010-07-05 · 上證有買貴冇買錯", "url": "https://chaozmarket.blogspot.com/2010/08/2010-07-05.html", "kind": "原文"}], "case": {"lesson": "7-1", "title": "2026 港股成交：全年同單月可呈不同方向", "period": "2026 年 1–8 月／8 月", "known": "港交所 2026 年 8 月市場概況", "checked": "2026-10-05", "facts": ["首八個月日均成交約 2,825 億港元，按年升 14%；8 月單月日均成交按年跌 17.5%。"], "connection": "較長期增長與短期轉弱可以同時存在。四年文章出現不同部署時，亦要分清作者所看嘅時段同資料。", "question": "呢兩個數字互相矛盾嗎？", "options": ["矛盾，必有一個錯。", "未必；期間不同可以造成不同同比。"], "answer": 1, "explanation": "先對齊時段。年度方向唔等於每月方向，更唔等於每日價格訊號。", "limits": "成交額係活動指標，唔係市場回報；來源頁會更新，需選回 2026 年 8 月。", "sources": [{"label": "港交所｜每月市場概況（選 2026 年 8 月）", "url": "https://www.hkex.com.hk/Market-Data/Statistics/Consolidated-Reports/HKEX-Monthly-Market-Highlights?sc_lang=zh-cn"}], "calculation": null}}, {"id": "7-2", "number": "7.2", "chapter": "years", "title": "跨年揀股清單：增長要有現金支持", "desc": "由原文建立一張可以核對嘅研究清單。", "takeaway": ["先研究行業同企業增長原因。", "盈利、現金流、負債同估值一齊看。", "價格趨勢唔能取代公司研究。"], "author": "2007 年重視盈利增長與企業轉型；2010 年明確提醒純利上升而現金流未跟上要小心。將兩者同前面趨勢、估值及風險課合併，可以形成研究流程。流程係本次教學延伸。", "sections": [["第一步：寫清楚增長來源", "需求增加、產品轉型、客戶數目定利潤率改善？用已公布資料核對，唔只係寫「有概念」。"], ["第二步：檢查盈利質素", "對照經營現金流、應收賬及一次性收益。現金流亦要看成因；單期弱勢唔自動證明造假，而賬面盈利亦唔保證現金充足。"], ["第三步：連估值、趨勢同退出一齊寫", "檢查負債、盈利假設及價格是否已反映好消息，再定比較基準、投入資金與離場條件。呢張係研究清單，唔係已驗證嘅自動買入模型。"]], "example": "自設例子：甲公司盈利升 30%，但客戶拖數令應收賬急增。先查現金收回時間及財務壓力，唔好單用盈利增幅作買入理由。", "task": "為一家公司記低增長原因、盈利與現金流差異，以及一項令你放棄嘅條件。", "question": "公司盈利上升，但現金流轉差，應該先做乜？", "options": ["直接認定一定造假。", "查差異來源、持續時間同財務壓力。"], "answer": 1, "explanation": "差異值得調查，但單一數字唔足以證明造假或值得買入。", "sources": [{"label": "2007-11-08 · 努力射中牛眼", "url": "https://chaozmarket.blogspot.com/2007/11/2007-11-08.html", "kind": "原文"}, {"label": "2010-07-05 · 上證有買貴冇買錯", "url": "https://chaozmarket.blogspot.com/2010/08/2010-07-05.html", "kind": "原文"}], "case": {"lesson": "7-2", "title": "阿里巴巴：經營現金正，自由現金卻負", "period": "截至 2026-03-31 財年", "known": "2026-05-13", "checked": "2026-10-05", "facts": ["FY2026 經營現金流約人民幣 762.13 億元；公司定義嘅自由現金流為流出 466.09 億元。公告將轉弱連結即時零售與雲基建投入。"], "connection": "研究盈利要同時問現金點用。自由現金流負數可以源於投資支出，但需要查投入回報、資金來源及持續性，唔可以自動視為好或壞。", "question": "應該直接因負自由現金流而判定造假嗎？", "options": ["應該。", "唔應該；先核對調節、投入與資金壓力。"], "answer": 1, "explanation": "經營現金流同扣除投資後嘅現金衡量不同；調節表先能解釋差異。", "limits": "自由現金流屬 non-GAAP，按公司定義；唔宜與其他公司未經調節直接比較。", "sources": [{"label": "阿里巴巴｜FY2026 業績（2026-05-13），PDF 第 27 頁", "url": "https://data.alibabagroup.com/ecms-files/1532295521/5b1cb883-8d00-4237-a148-6631cc12a5d2/Alibaba%20Group%20Announces%20March%20Quarter%202026%20and%20Fiscal%20Year%202026%20Results.pdf"}], "calculation": null}}, {"id": "7-3", "number": "7.3", "chapter": "years", "title": "欣賞作者，亦讀佢認錯嘅段落", "desc": "避免只收藏準確預測，而忽略失誤與修改。", "takeaway": ["同時記錄命中、失誤同未確定。", "修正判斷唔等於完整策略已證明有效。", "目標、預測同真實回報要分開。"], "author": "2009 年搜狐訪問轉載嘅博客導言提到港股反彈判斷失誤；2010 年 2 月文章亦承認 2008 年 11 月反應慢、2009 年 8 月反應敏感。呢啲資料幫你理解方法限制。", "sections": [["博客評論同作者原話分開", "訪問轉載前嘅導言係刊登者評論，唔應當成作者自述。文章正文內嘅反思則可以另外記錄，標明來源。"], ["唔用結果倒推當時規則", "逐次記低原本預測、後續修正及可執行條件。只挑成功例子會令方法看似過度準確。"], ["「點樣贏」先要可以檢驗", "文章提出研究方向同紀律，但仍欠完整交易、費用及回撤資料。要知道有冇優勢，需要固定規則、公平基準及包含失敗個案嘅測試。"]], "example": "某次預期阻力未能擋住升勢，先記為該次判斷失誤；唔需要貶低作者，亦唔好刪除原先講法再聲稱全部預測準確。", "task": "建立三欄讀書筆記：當時觀點、後續修改、仍欠證據。", "question": "想公平理解作者方法，應該保存邊啲例子？", "options": ["只保存成功預測。", "成功、失誤同未確定嘅例子都保存。"], "answer": 1, "explanation": "完整紀錄先能避免事後選擇性記憶。", "sources": [{"label": "曹仁超接受搜狐訪問透露 A 股將成 W 型牛市格局 · 博客刊登 2009-05-03", "url": "https://chaozmarket.blogspot.com/2009/05/w.html", "kind": "原文"}, {"label": "2010-02-01 · 奧巴馬「變臉」 大鱷即「做嘢」", "url": "https://chaozmarket.blogspot.com/2010/02/2010-02-01.html", "kind": "原文"}], "case": {"lesson": "7-3", "title": "Meta：2026 開支指引仍然係預測", "period": "2026 開支展望", "known": "2026-01-28", "checked": "2026-10-05", "facts": ["Meta 當時預期 2026 main.innerHTML=`${warning()}<div class="breadcrumbs"><a href="#courses">學習庫</a> › ${saved?'我的收藏':'文章目錄'}</div><div class="page-heading"><div><p class="eyebrow">${saved?'留低值得再睇嘅文章':'由主題搵返原文'}</p><h1>${saved?'我的收藏':'文章目錄'}</h1><p>${saved?'收藏只會保存在目前瀏覽器，方便你下次溫習。':'2007–2010 全部 476 篇文章，每篇附原創主題短摘要。可以按年份、主題同字詞搵。'}</p></div></div><div class="actions download-row"><a class="btn light" href="article_summaries_zh_hk.txt" download>下載 476 篇摘要 ↓</a><a class="btn light" href="#lesson/7-1">四年閱讀指南 →</a></div><div class="library-controls"><div class="search"><input id="article-search" type="search" aria-label="搜尋文章目錄" placeholder="搜尋標題、日期或主題，例如：止蝕、2008-10、PEG" value="${esc(libraryQuery)}"></div><select id="article-year" aria-label="文章年份">${['全部年份','2007','2008','2009','2010'].map(y=>`<option ${libraryYear===y?'selected':''}>${y}</option>`).join('')}</select><select id="article-topic" aria-label="文章主題">${topics.map(t=>`<option ${libraryTopic===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="result-info"><span id="result-count" role="status"></span><span>摘要按標題及選讀段落整理；標籤按關鍵字分類。</span></div><div class="article-grid" id="article-results"></div><div class="pager" id="pager"><button class="btn light" id="prev-page">← 上一頁</button><span id="page-count"></span><button class="btn light" id="next-page">下一頁 →</button></div><p class="footnote">搜尋涵蓋標題、原創短摘要、日期及主題，唔係全文。摘要只突出部分主題，唔代替完整原文。開啟原文需要網絡；原文標題日期同博客刊登日期可能唔同。</p>`;

function renderAbout(){currentView='about';main.innerHTML=`<div class="breadcrumbs"><a href="#courses">學習庫</a> › 關於整理</div><article class="about"><p class="eyebrow">閱讀之前，了解資料範圍</p><h1>觀點有來源，練習有標示。</h1><p>呢個係私人學習整理，以你提供嘅「曹仁超投資者筆記」博客為資料來源，前六章主要分析 2008 年文章，第七章跨年份比較。博客刊登者顯示為 JoeJai；呢份整理唔係作者官方網站，亦唔係經審核嘅交易紀錄。</p><h2>收錄幾多資料？</h2><p>2026 年 10 月 5 日，公開博客資料源列出 476 篇文章：2007 年 108 篇、2008 年 274 篇、2009 年 58 篇、2010 年 36 篇。目錄收錄全部 476 個獨立文章項目；全部附主題短摘要；前六章課程以 2008 年為主，第七章比較四年方法。</p><h2>課堂點樣整理？</h2><p>逐篇檢視文章標題及選讀段落，撰寫原創主題短摘要；再選讀與投資規則相關嘅段落編成課堂。摘要突出部分議題，唔代表逐行全文分析。課堂用原創文字解釋概念，將原文脈絡、教學延伸、例子同自測分開。呢個唔代表每篇文章已經逐行人手分析。</p><p>原文部分字形同財務縮寫有缺損。部分 2010 年文章喺 8 月集中刊登，但內文日期較早；刊登時間唔代表觀點提出時間。文章標題日期、網址日期、內文日期同刊登時間亦可能唔同，目錄保留現有資料，唔擅自統一日期。</p><h2>點樣搵資料？</h2><p>想有次序學，可以由第一課開始；想解決特定問題，可以搜尋課堂。文章目錄可以搵標題、短摘要、日期同關鍵字主題。股票詞彙、經濟學家介紹及衍生工具入門另標示為補充知識，唔當成作者揀股規則。標籤可能只反映文中一段提及，唔代表成篇文章支持某個做法。</p><h2>近年案例點整理？</h2><p>21 課各配一個真實案例練習，選用企業公告、年報、監管檢討、交易所統計及當日市場報道。案例涵蓋 2023–2026，核對日為 2026 年 10 月 5 日；部分事件重用於不同概念。每個案例分開事實、教學分析、判斷問題同限制。財報結束日、公布日與資料核對日唔相同；預測亦唔當成已實現結果。近年例子係本次教學延伸，唔係曹仁超本人對近年市場嘅評論。</p><h2>進度同收藏保存喺邊？</h2><p>閱讀進度、收藏同課堂筆記只保存在目前瀏覽器，唔會傳送去伺服器或同步到其他裝置。清除瀏覽器資料、轉用另一個瀏覽器，或者某啲私隱設定，都可能令進度遺失。全部課堂可直接閱讀。</p><h2>呢度可以證明點樣贏股市嗎？</h2><p>唔可以。未有做策略回測、重建作者帳戶，亦未驗證超額回報。歷史觀點需要放返當時情境理解；例子係教學用，唔係個人投資建議。</p><h2>原文同參考介面</h2><p><a href="https://chaozmarket.blogspot.com/" target="_blank" rel="noopener noreferrer">曹仁超投資者筆記：博客原文 ↗</a></p><p>章節、短課同來源導覽參考你提供嘅 <a href="https://www.cashmate.hk/learn" target="_blank" rel="noopener noreferrer">Cashmate 知識庫 ↗</a>，課堂文字與練習為本次原創整理。</p><div class="actions"><a class="btn" href="#lesson/1-1">由第一課開始 →</a><a class="btn light" href="#library">搵文章原文</a></div></article>`;}

function renderWorkshop(){currentView='workshop';main.innerHTML=`<div class="breadcrumbs"><a href="#courses">學習庫</a> › 互動練習</div><div class="page-heading"><div><p class="eyebrow">少一點死記 · 多一次實驗</p><h1>自己試一次，理解更深。</h1><p>改變數字，看清注碼同回本數學；再用重點卡溫習。</p></div></div><div class="workshop-layout"><section class="workshop-panel"><span class="label">01 · 風險實驗室</span><h2>跌幅相同，注碼改變結果。</h2><div class="range-row"><label for="capital">組合資金 <output id="capital-value"></output></label><input id="capital" type="range" min="10000" max="1000000" step="10000" value="100000"></div><div class="range-row"><label for="allocation">股票佔比 <output id="allocation-value"></output></label><input id="allocation" type="range" min="0" max="100" value="30"></div><div class="range-row"><label for="decline">股票跌幅 <output id="decline-value"></output></label><input id="decline" type="range" min="1" max="90" value="20"></div><div class="calc-output" aria-live="polite"><span>假設組合損失</span><strong id="loss-value"></strong><span id="loss-description"></span></div><div class="loss-track" aria-hidden="true"><i id="loss-bar"></i></div><p id="recovery-value" role="status"></p><p class="footnote">教學假設：股票部位同步下跌，其餘資金不變；不計費用、稅項、槓桿或交易滑價。回本升幅按整個組合計，唔係市場預測。</p><a class="source-link" href="#lesson/4-2">返注碼課堂 →</a></section><section class="workshop-panel"><span class="label">02 · 概念重點卡</span><h2>先回想，再揭曉。</h2><p class="studio-stat" id="flash-count"></p><div class="flashcard" id="flashcard" aria-live="polite"></div><div class="flash-controls"><button class="btn" id="flip-card">揭曉重點</button><button class="btn light" id="next-card">下一張 →</button></div><p class="footnote">重點卡係課堂摘要，唔係交易指令。你可以返回對應課堂閱讀完整脈絡。</p><a id="flash-link" class="source-link"></a></section></div>`;
const ranges=['capital','allocation','decline'];function calculate(){const capital=Number(document.getElementById('capital').value),allocation=Number(document.getElementById('allocation').value),decline=Number(document.getElementById('decline').value),loss=capital*allocation/100*decline/100,percent=allocation*decline/100;document.getElementById('capital-value').textContent='HK$'+capital.toLocaleString('en-HK');document.getElementById('allocation-value').textContent=allocation+'%';document.getElementById('decline-value').textContent=decline+'%';document.getElementById('loss-value').textContent='HK$'+loss.toLocaleString('en-HK',{maximumFractionDigits:0});document.getElementById('loss-description').textContent='佔組合 '+percent.toFixed(1)+'% · 剩餘 HK$'+(capital-loss).toLocaleString('en-HK',{maximumFractionDigits:0});document.getElementById('loss-bar').style.width=percent+'%';document.getElementById('recovery-value').textContent='由剩餘組合價值回本，需要升 '+(percent/(100-percent)*100).toFixed(2)+'%。';}for(const id of ranges)document.getElementById(id).addEventListener('input',calculate);calculate();
let index=0,revealed=false;function card(){const l=DATA.lessons[index];document.getElementById('flash-count').textContent='第 '+(index+1)+' / '+DATA.lessons.length+' 張 · 第 '+l.number+' 課';document.getElementById('flashcard').innerHTML=revealed?`<span class="label">課堂重點</span><p>${esc(l.takeaway[0])}</p>`:`<span class="label">試下用自己說話解釋</span><h3>${esc(l.title)}</h3><p>呢課最想你記住乜？</p>`;document.getElementById('flip-card').textContent=revealed?'返回問題':'揭曉重點';document.getElementById('flip-card').setAttribute('aria-pressed',String(revealed));document.getElementById('flash-link').textContent='閱讀第 '+l.number+' 課 →';document.getElementById('flash-link').href='#lesson/'+l.id;}document.getElementById('flip-card').addEventListener('click',()=>{revealed=!revealed;card();});document.getElementById('next-card').addEventListener('click',()=>{index=(index+1)%DATA.lessons.length;revealed=false;card();});card();}

function route(){document.body.classList.toggle('in-lesson',location.hash.startsWith('#lesson/'));const hash=location.hash.slice(1)||'courses';if(hash.startsWith('lesson/'))renderLesson(hash.slice(7));else if(hash==='library'||hash.startsWith('library/')){if(hash.startsWith('library/')){const y=hash.split('/')[1];libraryYear=['2007','2008','2009','2010'].includes(y)?y:'全部年份';libraryQuery='';libraryTopic='全部主題';page=1;}renderLibrary();}else if(hash==='saved'){libraryYear='全部年份';libraryTopic='全部主題';libraryQuery='';page=1;renderLibrary(true);}else if(hash==='workshop')renderWorkshop();else if(hash==='cases')renderCases();else if(hash==='about')renderAbout();else renderCourses();updateHeader();const h=main.querySelector('h1');document.title=h?h.textContent.replace(/\s+/g,' ')+'｜曹仁超學習庫':'曹仁超學習庫';window.scrollTo({top:0,left:0,behavior:'instant'});document.getElementById('read-track').style.width='0%';main.focus({preventScroll:true});}
window.addEventListener('scroll',()=>{const height=document.documentElement.scrollHeight-innerHeight;document.getElementById('read-track').style.width=(document.body.classList.contains('in-lesson')&&height>0?scrollY/height*100:0)+'%';},{passive:true});
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView({block:'start'});});
window.addEventListener('hashchange',route);route();
</script>
