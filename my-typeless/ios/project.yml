# 用 XcodeGen 生成 Xcode 專案：brew install xcodegen && xcodegen
name: MyTypeless
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # 改做你自己獨一無二嘅名，例如 com.wilson.mytypeless
    APP_BUNDLE_ID: com.yourname.mytypeless
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  MyTypeless:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: Keyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: My Typeless
        UILaunchScreen: {}
  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - path: ../prompt.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: My Typeless
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hant
            RequestsOpenAccess: true
